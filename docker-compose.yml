services:
  postgres:
    image: postgres:17-alpine
    container_name: dtd-postgres
    environment:
      POSTGRES_DB: dtd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - dtd-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dtd"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dtd-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      Database__ConnectionString: "Host=postgres;Port=5432;Database=dtd;Username=postgres;Password=postgres"
      Database__AutoApplyMigrations: "true"
      Erp__UseMock: "true"
      Docuten__UseMock: "true"
      ASPNETCORE_ENVIRONMENT: Development
    ports:
      - "8080:8080"

volumes:
  dtd-postgres-data: