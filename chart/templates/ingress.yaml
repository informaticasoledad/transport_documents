{{- if .Values.ingress.enabled }}
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: {{ .Values.appName }}
  namespace: default
  annotations:
    external-dns.alpha.kubernetes.io/target: lbcentral.solucionait.es
    kubernetes.io/ingress.class: traefik
spec:
  entryPoints:
    - websecure
  routes:
  - match: Host(`{{ .Values.ingress.host }}`)
    kind: Rule
    services:
    - name: {{ .Values.appName }}
      port: 80
  tls:
#    certResolver: myresolver
    secretName: {{ .Values.ingress.host | quote }}
{{- end }}
